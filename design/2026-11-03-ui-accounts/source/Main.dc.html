<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Todos — inside the application shell</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app page {{themeClass}}">
<dc-import name="TopBar" theme="{{themeName}}" account="{{account}}" current="todos" open="{{menuOpen}}" focus-sign-out="{{focusSignOut}}" hint-size="100%,64px"></dc-import>

<sc-if value="{{signedOut}}" hint-placeholder-val="{{ false }}">
<main class="wrap" style="padding-top: 96px; gap: 24px">
<sc-if value="{{showSignedOutNotice}}" hint-placeholder-val="{{ false }}">
<p class="notice notice-ok" role="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.8 2.8L16.5 9.5"></path></svg><span>You’re signed out on this device.</span></p>
</sc-if>
<h1 class="h1">Todos</h1>
<p class="lede">Sign in to see your list. Your to-dos are kept with your account.</p>
<div class="row-actions">
<a href="SignIn.dc.html" class="btn btn-primary">Sign in</a>
<a href="SignUp.dc.html" class="btn btn-secondary">Create an account</a>
</div>
</main>
</sc-if>

<sc-if value="{{signedIn}}" hint-placeholder-val="{{ true }}">
<main class="todo-main" style="width: 100%; max-width: 640px; margin: 0 auto; box-sizing: border-box; padding: 96px 24px 40px; display: flex; flex-direction: column">
<h1 style="margin: 0 0 28px; font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1">Todos</h1>
<form class="new-form {{formMods}}" onSubmit="{{submit}}" style="display: flex; flex-direction: column; padding: 4px 0 10px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 22px; height: 22px; flex: none; display: inline-flex">
<sc-if value="{{hasTodos}}" hint-placeholder-val="{{ true }}">
<button type="button" class="toggle-all {{allMods}}" aria-pressed="{{allDone}}" aria-label="Mark all as complete" onClick="{{toggleAll}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
</sc-if>
</span>
<label for="new-todo" class="vh">New to-do</label>
<input id="new-todo" class="new-input" type="text" placeholder="What needs doing?" autocomplete="off" value="{{newTitle}}" onChange="{{onNewChange}}" aria-describedby="new-todo-error" aria-invalid="{{hasError}}" style="flex: 1; min-width: 0; height: 44px; font-size: 19px; line-height: 1.3">
</div>
<p id="new-todo-error" class="field-error {{errorMods}}" aria-live="polite" style="margin: 0; padding-left: 36px">{{error}}</p>
</form>
<ul style="list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<li class="row {{item.rowMods}}" style="display: flex; align-items: flex-start; gap: 14px; padding: 11px 8px; margin: 0 -8px; border-radius: 10px">
<span style="position: relative; width: 22px; height: 22px; flex: none; margin-top: 2px">
<input type="checkbox" class="check {{item.checkMods}}" id="{{item.checkId}}" checked="{{item.done}}" onChange="{{item.toggle}}" aria-labelledby="{{item.titleId}}">
<svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 12.5l3.5 3.5 7.5-8"></path></svg>
</span>
<button type="button" class="title" style="font-size: 17px; line-height: 1.5"><span id="{{item.titleId}}">{{item.title}}</span><span class="vh">, press Enter to edit</span></button>
<button type="button" class="remove" aria-label="{{item.removeLabel}}" onClick="{{item.remove}}" style="margin: -5px -8px -5px 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</li>
</sc-for>
</ul>
<sc-if value="{{hasTodos}}" hint-placeholder-val="{{ true }}">
<footer class="footer" style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin-top: 20px; padding: 14px 0 10px; font-size: 14px">
<p style="margin: 0; color: var(--fg2)"><strong style="color: var(--fg); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums">{{leftCount}}</strong> {{leftLabel}}</p>
<nav aria-label="Filter to-dos" style="display: flex; gap: 2px">
<a href="#all" class="filter {{fAll}}" aria-current="{{cAll}}" onClick="{{setAll}}">All</a>
<a href="#active" class="filter {{fActive}}" aria-current="{{cActive}}" onClick="{{setActive}}">Active</a>
<a href="#completed" class="filter {{fCompleted}}" aria-current="{{cCompleted}}" onClick="{{setCompleted}}">Completed</a>
</nav>
<sc-if value="{{anyDone}}" hint-placeholder-val="{{ true }}">
<button type="button" class="clear" onClick="{{clearCompleted}}" style="justify-self: end; margin-right: -10px">Clear completed</button>
</sc-if>
</footer>
</sc-if>
</main>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"account":{"editor":"enum","options":["out","member","admin"],"default":"member","section":"State"},"open":{"editor":"boolean","default":false,"section":"State"},"notice":{"editor":"enum","options":["none","signedOut"],"default":"none","section":"State"},"focusSignOut":{"editor":null},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.initial();
  }
  initial() {
    return {
      todos: [
        { id: 1, title: 'Renew passport', done: true },
        { id: 2, title: 'Book a table for Friday dinner', done: false },
        { id: 3, title: 'Send the October invoice', done: false },
        { id: 4, title: 'Water the plants', done: true },
        { id: 5, title: 'Call the plumber about the kitchen tap', done: false }
      ],
      nextId: 6, filter: 'all', newTitle: '', error: '', lastToggled: null
    };
  }
  cur(s) { return (s && s.todos) ? s : this.initial(); }
  up(fn) { this.setState((p) => { const s = this.cur(p); return Object.assign({}, s, fn(s)); }); }
  add() {
    this.up((s) => {
      const t = s.newTitle.trim();
      if (t.length < 1 || t.length > 256) return { error: 'Title must be 1 to 256 characters' };
      if (s.todos.length >= 500) return { error: 'This list is full — it holds 500 to-dos. Clear completed or remove some to add more.' };
      return { todos: s.todos.concat([{ id: s.nextId, title: t, done: false }]), nextId: s.nextId + 1, newTitle: '', error: '' };
    });
  }
  setFilter(f, e) { if (e && e.preventDefault) e.preventDefault(); this.up(() => ({ filter: f })); }
  renderVals() {
    const s = this.cur(this.state);
    const theme = (this.props.theme || 'light') === 'dark' ? 'dark' : 'light';
    const account = this.props.account || 'member';
    const left = s.todos.filter((t) => !t.done).length;
    const visible = s.todos.filter((t) => s.filter === 'all' ? true : (s.filter === 'active' ? !t.done : t.done));
    const allDone = s.todos.length > 0 && left === 0;
    return {
      themeClass: theme, themeName: theme, account: account,
      menuOpen: !!this.props.open,
      focusSignOut: !!this.props.focusSignOut,
      signedOut: account === 'out', signedIn: account !== 'out',
      showSignedOutNotice: this.props.notice === 'signedOut',
      items: visible.map((t) => ({
        title: t.title, done: t.done,
        checkId: 'todo-' + t.id, titleId: 'title-' + t.id,
        rowMods: t.done ? 'done' : '',
        checkMods: s.lastToggled === t.id ? 'just-done' : '',
        removeLabel: 'Remove ‘' + t.title + '’',
        toggle: () => this.up((p) => ({ todos: p.todos.map((x) => x.id === t.id ? Object.assign({}, x, { done: !x.done }) : x), lastToggled: t.id })),
        remove: () => this.up((p) => ({ todos: p.todos.filter((x) => x.id !== t.id) }))
      })),
      hasTodos: s.todos.length > 0,
      allDone: allDone, allMods: allDone ? 'is-on' : '',
      anyDone: s.todos.length - left > 0,
      leftCount: left, leftLabel: left === 1 ? 'item left' : 'items left',
      fAll: s.filter === 'all' ? 'is-current' : '', cAll: s.filter === 'all' ? 'page' : false,
      fActive: s.filter === 'active' ? 'is-current' : '', cActive: s.filter === 'active' ? 'page' : false,
      fCompleted: s.filter === 'completed' ? 'is-current' : '', cCompleted: s.filter === 'completed' ? 'page' : false,
      newTitle: s.newTitle, error: s.error, hasError: !!s.error,
      errorMods: s.error ? 'is-visible' : '', formMods: s.error ? 'has-error' : '',
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.add(); },
      onNewChange: (e) => { const v = e.target.value; this.up(() => ({ newTitle: v, error: '' })); },
      toggleAll: () => this.up((p) => { const all = p.todos.every((t) => t.done); return { todos: p.todos.map((t) => Object.assign({}, t, { done: !all })), lastToggled: null }; }),
      clearCompleted: () => this.up((p) => ({ todos: p.todos.filter((t) => !t.done) })),
      setAll: (e) => this.setFilter('all', e),
      setActive: (e) => this.setFilter('active', e),
      setCompleted: (e) => this.setFilter('completed', e)
    };
  }
}
</script>
</body>
</html>
