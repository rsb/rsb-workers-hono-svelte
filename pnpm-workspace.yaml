packages:
  - apps/*
  - packages/*
  - packages/contract/*
  - packages/data/*

engineStrict: true
saveExact: true

# Native binaries: esbuild for bundling, workerd for the local Workers runtime.
allowBuilds:
  esbuild: true
  workerd: true

catalog:
  typescript: 6.0.3
  valibot: 1.5.0
  vitest: 5.0.5
  wrangler: 4.156.0
